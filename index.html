<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Nova Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0a0910;
    --bg-surface: #15131d;
    --bg-surface-2: #1c192a;
    --accent-gold: #c9a962;
    --accent-nova: #7c6cff;
    --accent-nova-soft: rgba(124,108,255,0.35);
    --text-primary: #eae7f0;
    --text-muted: #8b8797;
    --ring: rgba(201,169,98,0.5);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: radial-gradient(1200px 800px at 50% -10%, #171325 0%, var(--bg-deep) 55%, #060509 100%);
    color: var(--text-primary);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header{
    position: relative;
    text-align: center;
    padding: 4.5rem 1.5rem 3rem;
    overflow: hidden;
  }

  .nova-pulse-ring{
    position: absolute;
    top: 50%; left: 50%;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid var(--accent-nova-soft);
    transform: translate(-50%,-50%);
    animation: pulse-out 4.5s ease-out infinite;
    pointer-events: none;
  }
  .nova-pulse-ring.r2{ animation-delay: 1.5s; }
  .nova-pulse-ring.r3{ animation-delay: 3s; }

  @keyframes pulse-out{
    0%{ width:10px; height:10px; opacity:0.9; border-color: rgba(124,108,255,0.6); }
    100%{ width:640px; height:640px; opacity:0; border-color: rgba(124,108,255,0); }
  }

  @media (prefers-reduced-motion: reduce){
    .nova-pulse-ring{ animation: none; opacity:0; }
  }

  h1{
    position: relative;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 4rem);
    letter-spacing: 0.06em;
    margin: 0;
    background: linear-gradient(180deg, #fdfbff 0%, var(--accent-gold) 120%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subhead{
    position: relative;
    margin-top: 0.6rem;
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ---------- Gallery ---------- */
  main{
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.25rem 2rem;
  }

  .section-name{
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    letter-spacing: 0.05em;
    color: var(--accent-gold);
    margin: 2.2rem 0 1.1rem;
    padding-left: 0.2rem;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 1.4rem 1.1rem;
    margin-bottom: 1.5rem;
  }

  .card{
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg-surface);
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.45);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }

  .card:hover, .card:focus-visible{
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 0 0 2px var(--ring), 0 0 32px var(--accent-nova-soft), 0 12px 28px rgba(0,0,0,0.55);
    outline: none;
  }

  .card img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, var(--bg-surface), var(--bg-surface-2));
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .card img.loaded{ opacity: 1; }

  .card .fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 0.65rem; color: var(--text-muted); text-align:center; padding: 0.5rem;
    background: var(--bg-surface);
  }

  /* ---------- Pagination ---------- */
  .pagination{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    padding: 2rem 1rem 4rem;
  }

  .pagination button{
    min-width: 2.4rem;
    height: 2.4rem;
    padding: 0 0.6rem;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    background: var(--bg-surface);
    color: var(--text-muted);
    font-family: 'Manrope', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .pagination button:hover{
    color: var(--text-primary);
    border-color: var(--accent-nova-soft);
  }

  .pagination button.active{
    color: #0a0910;
    background: linear-gradient(180deg, var(--accent-gold), #a9884d);
    border-color: transparent;
    box-shadow: 0 0 18px var(--accent-nova-soft);
    font-weight: 700;
  }

  .pagination .ellipsis{
    display:flex; align-items:center; color: var(--text-muted); padding: 0 0.2rem;
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(6,5,9,0.94);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 2rem;
  }
  .lightbox.open{ display: flex; }

  .lightbox img{
    max-width: 92vw;
    max-height: 86vh;
    border-radius: 12px;
    box-shadow: 0 0 60px var(--accent-nova-soft), 0 20px 60px rgba(0,0,0,0.6);
  }

  .lightbox .close{
    position: absolute;
    top: 1.5rem; right: 1.5rem;
    width: 2.6rem; height: 2.6rem;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
  }
  .lightbox .close:hover{ background: rgba(255,255,255,0.14); }

  .lightbox .nav-btn{
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 2.8rem; height: 2.8rem;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
    font-size: 1.2rem;
    cursor: pointer;
  }
  .lightbox .nav-btn:hover{ background: rgba(255,255,255,0.14); }
  .lightbox .prev{ left: 1.2rem; }
  .lightbox .next{ right: 1.2rem; }

  footer{
    text-align:center;
    color: var(--text-muted);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding-bottom: 2.5rem;
  }

  @media (max-width: 480px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 1rem 0.8rem; }
    .lightbox .nav-btn{ width: 2.3rem; height: 2.3rem; }
  }
</style>
</head>

<header>
  <div class="nova-pulse-ring"></div>

  <div class="subhead">Profile Gallery</div>
</header>

<main>

  <img id="lb-img" src="" alt="">
  <button class="nav-btn next" id="lb-next" aria-label="Next">&#8250;</button>
</div>

    blobBase: "https://github.com/InfiniteProfile/NovaPulse/blob/main/",
    pageSize: 30
  };

  // ---------- Build sections from GALLERY_ITEMS (data comes from gallery-data.js) ----------
  // A "section" groups consecutive images under the last-seen header.
  // Images before any header, or when no headers exist at all, form a headerless section.
  function buildSections(items){
    const sections = [];
    let current = { name: null, files: [] };

    items.forEach(item => {
      if(item.type === "header"){
        if(current.files.length) sections.push(current);
        current = { name: item.name, files: [] };
      } else if(item.type === "image"){
        current.files.push(item.file);
      }
    });
    if(current.files.length) sections.push(current);
    return sections;
  }

  const sections = buildSections(typeof GALLERY_ITEMS !== "undefined" ? GALLERY_ITEMS : []);

  // Flatten into a single ordered list of {name, file} so pagination can slice
  // across section boundaries while still re-printing headers per page.
  const flat = [];
  sections.forEach(sec => {
    sec.files.forEach(file => flat.push({ name: sec.name, file }));
  });

  const totalPages = Math.max(1, Math.ceil(flat.length / CONFIG.pageSize));
  let currentPage = 1;
  let pageEntries = []; // entries currently on screen, for lightbox nav

  const gridContainer = document.getElementById("grid-container");
  const paginationEl = document.getElementById("pagination");

  // ---------- Lazy loading ----------
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const img = entry.target;
        img.src = img.dataset.src;
        obs.unobserve(img);
      }
    });
  }, { rootMargin: "200px 0px" });

  function loadImg(img){
    img.addEventListener("load", () => img.classList.add("loaded"), { once:true });
    img.addEventListener("error", () => {
      const card = img.closest(".card");
      if(card){
        img.remove();
        const fb = document.createElement("div");
        fb.className = "fallback";
        fb.textContent = "Image unavailable";
        card.appendChild(fb);
      }
    }, { once:true });
    observer.observe(img);
  }

  // ---------- Render a page ----------
  function renderPage(page){
    currentPage = Math.min(Math.max(1, page), totalPages);
    const start = (currentPage - 1) * CONFIG.pageSize;
    const end = start + CONFIG.pageSize;
    pageEntries = flat.slice(start, end);

    gridContainer.innerHTML = "";
    let lastName = "__NONE_YET__";
    let grid = null;

    pageEntries.forEach((entry, idx) => {
      if(entry.name !== lastName){
        lastName = entry.name;
        if(entry.name){
          const h = document.createElement("div");
          h.className = "section-name";
          h.textContent = entry.name;
          gridContainer.appendChild(h);
        }
        grid = document.createElement("div");
        grid.className = "grid";
        gridContainer.appendChild(grid);
      }
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Open photo");
      card.dataset.index = idx;

      const img = document.createElement("img");
      img.dataset.src = CONFIG.rawBase + encodeURIComponent(entry.file);
      img.alt = "";
      img.loading = "lazy";
      card.appendChild(img);
      grid.appendChild(card);

      loadImg(img);

      card.addEventListener("click", () => openLightbox(idx));
      card.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openLightbox(idx); }
      });
    });

    renderPagination();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- Pagination controls (direct page access, windowed with ellipses) ----------
  function renderPagination(){
    paginationEl.innerHTML = "";
    if(totalPages <= 1) return;

    const addBtn = (label, page, isActive) => {
      const btn = document.createElement("button");
      btn.textContent = label;
      if(isActive) btn.classList.add("active");
      btn.addEventListener("click", () => renderPage(page));
      paginationEl.appendChild(btn);
    };

    const addEllipsis = () => {
      const span = document.createElement("span");
      span.className = "ellipsis";
      span.textContent = "…";
      paginationEl.appendChild(span);
    };

    const windowSize = 2;
    const pages = new Set([1, totalPages, currentPage]);
    for(let i = currentPage - windowSize; i <= currentPage + windowSize; i++){
      if(i >= 1 && i <= totalPages) pages.add(i);
    }
    const sorted = Array.from(pages).sort((a,b) => a - b);

    let prev = 0;
    sorted.forEach(p => {
      if(p - prev > 1) addEllipsis();
      addBtn(p, p, p === currentPage);
      prev = p;
    });
  }

  // ---------- Lightbox ----------
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  let lbIndex = 0;

  function openLightbox(idx){
    lbIndex = idx;
    updateLightboxImage();
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function updateLightboxImage(){
    const entry = pageEntries[lbIndex];
    if(!entry) return;
    lbImg.src = CONFIG.rawBase + encodeURIComponent(entry.file);
    lbImg.alt = "";
  }

  function closeLightbox(){
    lightbox.classList.remove("open");
    lbImg.src = "";
    document.body.style.overflow = "";
  }

  function stepLightbox(delta){
    if(!pageEntries.length) return;
    lbIndex = (lbIndex + delta + pageEntries.length) % pageEntries.length;
    updateLightboxImage();
  }

  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  document.getElementById("lb-prev").addEventListener("click", () => stepLightbox(-1));
  document.getElementById("lb-next").addEventListener("click", () => stepLightbox(1));
  lightbox.addEventListener("click", e => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", e => {
    if(!lightbox.classList.contains("open")) return;
    if(e.key === "Escape") closeLightbox();
    if(e.key === "ArrowLeft") stepLightbox(-1);
    if(e.key === "ArrowRight") stepLightbox(1);
  });

  // ---------- Init ----------
  renderPage(1);
})();
</script>
</body>
</html>
